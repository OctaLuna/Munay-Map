# CI — build + test del backend (NestJS) y frontend (React/Vite).
# Corresponde a la seccion 8 del documento tecnico definitivo:
#   build -> tests (la imagen Docker y el deploy viven en deploy-cloudrun.yml).
name: CI

on:
  push:
    branches: [production, main, leo-front]
  pull_request:
    branches: [production, main]

# Cancela corridas previas del mismo ref para ahorrar minutos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests (Jest)
        run: npm test

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b + vite build)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test
